[package]
name = "simply_ip_vault"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
# All three SQL drivers stay enabled on purpose: AGENT.MD requires the data layer to remain
# SQL-agnostic and PostgreSQL-ready, so `sqlx-postgres`/`sqlx-mysql` are a deliberate retention and
# not dead weight, even though SQLite is the zero-config default this suite runs on.
sea-orm = { version = "2", features = ["sqlx-postgres", "sqlx-mysql", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "2", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
ipnetwork = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hmac = "0.13"
tower-http = { version = "0.7", features = ["fs", "trace"] }
hex = "0.4"
rand = "0.10"
thiserror = "2"
dotenvy = "0.15"
log = "0.4"
# Primary AEAD for `signing_secret` at rest. XChaCha20's 192-bit nonce makes per-message random
# nonces collision-safe without any counter state to persist — see `src/crypto.rs`.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom"] }

# glibc malloc serializes allocations behind a process-wide lock; under a multi-threaded Tokio
# runtime that lock is the contention point. jemalloc uses per-thread arenas instead. Linux only:
# the allocator is selected in `main.rs` with the same cfg, so other targets keep the system one.
[target.'cfg(all(target_os = "linux", not(target_env = "msvc")))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# `test-util` unlocks the pausable clock (`tokio::time::pause`/`advance`). `src/replay.rs` expires
# entries against `tokio::time::Instant`, so its window and sweep behaviour can be driven exactly
# rather than by sleeping for real seconds in the test suite.
tokio = { version = "1", features = ["full", "test-util"] }
# Temporary directories for the file-backed SQLite tests. WAL cannot engage on `sqlite::memory:`,
# so proving it engages at all — and persists across reconnection — needs a real file on disk.
tempfile = "3"
# A real ECMAScript parser for `tests/frontend_syntax_test.rs`. `static/` is served from disk by
# `ServeDir` and is never compiled, so nothing else in the build can see a syntax error in it — a
# broken `app.js` shipped green through `cargo test` and the whole e2e suite once already.
# Deliberately a *parser* and not an engine: the file references `document` and `localStorage`, so
# executing it would fail for reasons that have nothing to do with syntax.
#
# Pinned to an exact version with `=`, unlike every other dependency here. `oxc` is pre-1.0, so its
# `0.x` releases carry breaking changes under a caret requirement: `0.90` → `0.143` renamed
# `ParserReturn::errors` to `diagnostics`, changed `labels` from `Option<Vec<_>>` to a slice, and
# widened `offset()` to `u32`. With `Cargo.lock` untracked, that moved under the build on its own and
# left the whole test suite unable to compile — every gate failing before a single assertion ran.
# A syntax checker that stops the build for reasons unrelated to syntax is worse than no checker, so
# this one does not float.
oxc_allocator = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_span = "=0.152.0"
